name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/krepe/**/*.hpp"
      - "scripts/build_docs.sh"
      - "scripts/render_api.py"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
      # TODO: Remove before merge.
      - docs/doxygen-api
    paths:
      - "docs/**"
      - "src/krepe/**/*.hpp"
      - "scripts/build_docs.sh"
      - "scripts/render_api.py"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO: Remove before merge.
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen
          python -m pip install -r docs/requirements.txt

      # TODO: Remove before merge.
      - name: Configure GitHub Pages
        id: pages
        if: >-
          github.event_name != 'pull_request' &&
          ((github.repository == 'CExA-project/KREPE' && github.ref == 'refs/heads/main') ||
           (github.repository == 'daxmawal/KREPE-fork' && github.ref == 'refs/heads/docs/doxygen-api'))
        uses: actions/configure-pages@v6

      # TODO: Remove before merge.
      - name: Build documentation
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # Adapt URLs only in the CI checkout; keep the upstream defaults in Git.
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          config = Path("zensical.toml")
          source = config.read_text()
          settings = {
              "repo_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}",
          }
          if base_url := os.environ.get("DOCS_SITE_URL"):
              settings["site_url"] = base_url.rstrip("/") + "/"
          for key, value in settings.items():
              source, count = re.subn(
                  rf"(?m)^{key}\s*=.*$",
                  lambda _: f"{key} = {json.dumps(value)}",
                  source,
              )
              if count != 1:
                  raise RuntimeError(f"Expected one {key} setting")
          config.write_text(source)
          PY
          bash scripts/build_docs.sh

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # if: >-
    #   github.event_name != 'pull_request' &&
    #   github.ref == 'refs/heads/main'
    # TODO: Remove before merge.
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
