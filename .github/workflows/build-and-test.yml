name: build-and-test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - README.md
    - docs/**
  push:
    branches:
    - main
    paths-ignore:
    - README.md
    - docs/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cmake:
    name: ${{ matrix.configuration.name }} with Kokkos ${{ matrix.kokkos_version }} (plugins ${{ matrix.krepe_enable_plugins }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Keep Release coverage for every supported Kokkos version.
        kokkos_version:
        - "5.0.0"
        - "5.1.0"
        - "5.2.0"
        krepe_enable_plugins:
        - ON
        - OFF
        configuration:
        - name: gcc Release build and tests
          compiler: gcc
          cxx: g++
          build_type: Release
          kokkos_enable_serial: "ON"
          kokkos_enable_openmp: "OFF"
          krepe_enable_asan: OFF
          krepe_enable_ubsan: OFF
          ctest_args: ''
          test_installation: true
        - name: clang Release build and tests
          compiler: clang
          cxx: clang++
          build_type: Release
          kokkos_enable_serial: "ON"
          kokkos_enable_openmp: "OFF"
          krepe_enable_asan: OFF
          krepe_enable_ubsan: OFF
          ctest_args: ''
          test_installation: true
        # Run extended coverage only for the latest supported version. Update
        # every include entry when rolling the matrix forward.
        include:
        - kokkos_version: "5.2.0"
          krepe_enable_plugins: ON
          configuration:
            name: clang ASan build and tests
            compiler: clang-asan
            cxx: clang++
            build_type: RelWithDebInfo
            kokkos_enable_serial: "ON"
            kokkos_enable_openmp: "OFF"
            krepe_enable_asan: ON
            krepe_enable_ubsan: OFF
            ctest_args: -L sanitizer_compatible
        - kokkos_version: "5.2.0"
          krepe_enable_plugins: ON
          configuration:
            name: clang UBSan build and tests
            compiler: clang-ubsan
            cxx: clang++
            build_type: RelWithDebInfo
            kokkos_enable_serial: "ON"
            kokkos_enable_openmp: "OFF"
            krepe_enable_asan: OFF
            krepe_enable_ubsan: ON
            ctest_args: -L sanitizer_compatible
        - kokkos_version: "5.2.0"
          krepe_enable_plugins: ON
          configuration:
            name: gcc OpenMP Release build and tests
            compiler: gcc-openmp
            cxx: g++
            build_type: Release
            kokkos_enable_serial: "OFF"
            kokkos_enable_openmp: "ON"
            krepe_enable_asan: OFF
            krepe_enable_ubsan: OFF
            ctest_args: ''
            test_installation: true

    env:
      CXX: ${{ matrix.configuration.cxx }}
      Kokkos_ROOT: ${{ github.workspace }}/.deps/kokkos-${{ matrix.kokkos_version }}-${{ matrix.configuration.compiler }}
      KOKKOS_VERSION: ${{ matrix.kokkos_version }}
      OMP_NUM_THREADS: "2"
      krepe_ROOT: ${{ github.workspace }}/krepe_install

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang \
          cmake \
          g++ \
          hdf5-tools \
          libhdf5-dev \
          ninja-build

    - name: Install GCC plugin system dependencies
      if: ${{ matrix.krepe_enable_plugins == 'ON' && matrix.configuration.cxx == 'g++' }}
      run: |
        sudo apt-get install -y --no-install-recommends \
          gcc-$(gcc -dumpversion)-plugin-dev \
          libgmp-dev

    - name: Install Clang plugin system dependencies
      if: ${{ matrix.krepe_enable_plugins == 'ON' && matrix.configuration.cxx == 'clang++' }}
      run: |
        sudo apt-get install -y --no-install-recommends \
          llvm-dev \
          libclang-dev
        echo "LLVM_ROOT=/usr/lib/llvm-$(clang -dumpversion | sed -e 's/\([0-9]\+\)\..*/\1/')" >> $GITHUB_ENV

    - name: Compute Kokkos cache fingerprint
      run: |
        {
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          echo "KOKKOS_VERSION=$KOKKOS_VERSION"
          echo "Kokkos_ENABLE_SERIAL=${{ matrix.configuration.kokkos_enable_serial }}"
          echo "Kokkos_ENABLE_OPENMP=${{ matrix.configuration.kokkos_enable_openmp }}"
          echo "matrix.compiler=${{ matrix.configuration.compiler }}"
          echo "CMAKE_BUILD_TYPE=${{ matrix.configuration.build_type }}"
          echo "CXX=$CXX"
          "$CXX" --version
          cmake --version
          ninja --version
        } > .kokkos-cache-fingerprint
        cat .kokkos-cache-fingerprint

    - name: Cache Kokkos install
      id: cache-kokkos
      uses: actions/cache@v6
      with:
        path: ${{ env.Kokkos_ROOT }}
        key: kokkos-${{ runner.os }}-${{ runner.arch }}-${{ env.KOKKOS_VERSION }}-${{ matrix.configuration.compiler }}-${{ hashFiles('.kokkos-cache-fingerprint') }}

    - name: Build and install Kokkos
      if: steps.cache-kokkos.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch "$KOKKOS_VERSION" https://github.com/kokkos/kokkos.git kokkos-src
        cmake -S kokkos-src -B kokkos-build -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ matrix.configuration.build_type }}" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_INSTALL_PREFIX="$Kokkos_ROOT" \
          -DKokkos_ENABLE_SERIAL="${{ matrix.configuration.kokkos_enable_serial }}" \
          -DKokkos_ENABLE_OPENMP="${{ matrix.configuration.kokkos_enable_openmp }}"
        cmake --build kokkos-build --parallel "$(nproc)"
        cmake --install kokkos-build

    - name: Configure project
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE="${{ matrix.configuration.build_type }}" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -DKREPE_BUILD_TESTS=ON \
          -DKREPE_ENABLE_WARNINGS=ON \
          -DKREPE_ENABLE_COMPILER_PLUGINS="${{ matrix.krepe_enable_plugins }}" \
          -DKREPE_ENABLE_ASAN="${{ matrix.configuration.krepe_enable_asan }}" \
          -DKREPE_ENABLE_UBSAN="${{ matrix.configuration.krepe_enable_ubsan }}"

    - name: Build project
      run: cmake --build build --parallel "$(nproc)"

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$(nproc)" ${{ matrix.configuration.ctest_args }}

    - name: Verify OpenMP execution space
      if: matrix.configuration.kokkos_enable_openmp == 'ON'
      run: h5dump -a /policy/space build/tests/range_policy/work/range_policy/krepe_*.h5 | grep -F '"OpenMP"'

    - name: Install the project
      if: ${{ matrix.configuration.test_installation }}
      run: cmake --install build --prefix "$krepe_ROOT"

    - name: Test the installation
      if: ${{ matrix.configuration.test_installation }}
      working-directory: ${{ github.workspace }}/tests/install_test
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration.build_type }}
        cmake --build build --parallel "$(nproc)"
        KOKKOS_TOOLS_LIBS="$krepe_ROOT/lib/libkrepe.so" KOKKOS_TOOLS_ARGS=--krepe-dump-kernel-label=test_kernel ./build/test
        shopt -s nullglob
        dumps=(krepe_*.h5)
        test "${#dumps[@]}" -eq 1
        ./build/replay_test --kernel-replayer-dump="${dumps[0]}"
