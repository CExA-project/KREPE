[project]
site_name = "KREPE"
site_description = "Kernel Replay Execution for Performance Evaluation"
site_url = "https://cexa-project.github.io/KREPE/"
repo_url = "https://github.com/CExA-project/KREPE"
copyright = """
  &copy; 2026 Contributors to the KREPE project &mdash;
  <a href="https://github.com/CExA-project/KREPE/blob/main/LICENSE">MIT License</a>
"""
extra_css = ["stylesheets/hdf5-tree.css"]
exclude_docs = "/doxygen/"

nav = [
    "index.md",
    { "Installation" = "installation.md" },
    { "Quickstart" = "quickstart.md" },
    { "Kernel capture" = "capture.md" },
    { "Kernel replay" = "replay.md" },
    { "Result validation" = "validation.md" },
    { "Benchmarking & auto-tuning" = "benchmarking.md" },
    { "Limitations" = "limitations.md" },
    { "C++ API" = [
        "reference/index.md",
        { "Capture" = [
            "reference/capture/index.md",
            { "parallel_for" = "reference/capture/parallel_for.md" },
            { "replay_functor" = "reference/capture/replay_functor.md" },
            { "add_metadata" = "reference/capture/add_metadata.md" },
        ] },
        { "Replay" = [
            "reference/replay/index.md",
            { "ScopeGuard" = "reference/replay/scopeguard.md" },
            { "initialize" = "reference/replay/initialize.md" },
            { "finalize" = "reference/replay/finalize.md" },
            { "parallel_for" = "reference/replay/parallel_for.md" },
            { "replay_functor" = "reference/replay/replay_functor.md" },
            { "force_policy" = "reference/replay/force_policy.md" },
            { "reset_inputs" = "reference/replay/reset_inputs.md" },
            { "ReplayAllocation" = "reference/replay/replayallocation.md" },
            { "get_allocations" = "reference/replay/get_allocations.md" },
            { "get_allocation" = "reference/replay/get_allocation.md" },
            { "get_out_allocation" = "reference/replay/get_out_allocation.md" },
            { "get_metadata" = "reference/replay/get_metadata.md" },
            { "compare_views" = "reference/replay/compare_views.md" },
        ] },
    ] },
    { "HDF5 file layout" = "hdf5-dumps.md" },
    { "Citing KREPE" = "citation.md" },
]

[project.theme]
features = ["navigation.indexes", "navigation.expand"]
